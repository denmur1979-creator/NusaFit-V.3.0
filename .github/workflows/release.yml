
name: NusaFit Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: nusafit-signed-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle.properties

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.NUSAFIT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NUSAFIT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSAFIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSAFIT_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64" || {
            echo "Secret NUSAFIT_KEYSTORE_B64 belum diisi"
            exit 1
          }

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/nusafit-release.keystore"

          printf '%s' "$KEYSTORE_B64" |
            base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD"

          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          STORE_PASSWORD: ${{ secrets.NUSAFIT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSAFIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSAFIT_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$GOOGLE_MAPS_API_KEY" || {
            echo "Secret GOOGLE_MAPS_API_KEY belum diisi"
            exit 1
          }

          gradle --no-daemon --stacktrace \
            -PNUSAFIT_KEYSTORE="$KEYSTORE_PATH" \
            -PNUSAFIT_STORE_PASSWORD="$STORE_PASSWORD" \
            -PNUSAFIT_KEY_ALIAS="$KEY_ALIAS" \
            -PNUSAFIT_KEY_PASSWORD="$KEY_PASSWORD" \
            -PGOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
            assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" -print -quit)

          test -n "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner -print -quit)

          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p release
          cp "$APK" release/NusaFit-release-signed.apk

          ls -lh release/*.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Signed-Release-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
